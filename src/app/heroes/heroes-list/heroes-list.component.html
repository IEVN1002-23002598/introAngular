
<div class="card">
    <div class="card-head">
        <h1>HEROES DRAGON BALL</h1>
        <div class="card-body">
            <div class="row">
                <div class="col-md-2">
                    Filtrar por:
                </div>
                <div class="col-md-4">
                    <!-- Enlace de dato bidireccional -->
                    <input [(ngModel)]="listFilter" type="text" class="form-control"
                    placeholder="Ingrese nombre del Heroe">
                </div>

            </div>
            <div class="class row">
                <div class="class col-md-6">
                    <h3>Filtro:{{listFilter}} </h3>
                </div>

            </div>

            <div class="table-responsive">
                <!-- *ngIf   Este es para validar -->
                <table class="table table-striped" *ngIf="heroes.length>0"> 
                    <thead>
                        <tr>
                            <th><button (click)="showImage()" class="btn btn-primary">
                                {{muestraImage?'Ocultar ': 'Muestra'}} >Imagen</button></th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Raza</th>
                            <th>Ki</th>
                        </tr>
                    </thead>
                    
                    <tbody>
                        <!--  *ngFor Este es para recorrer arreglos -->
                            <tr *ngFor="let heroe of heroes"> 
                                <td><img *ngIf='muestraImage' [src]="heroe.imagen" 
                                [style.width.px]="imageWidth"
                                [style.margin.px]="muestraImage"  /> </td>
                              
                              
                                <td>{{heroe.nombre}}</td>
                                <td>{{heroe.descripcion}}</td>
                                <td>{{heroe.race}}</td>
                                <td>{{heroe.Ki}}</td>
                            </tr>
                    </tbody>
                       
                </table>
            </div>
        </div>
    </div>
</div>
